name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Every Python file compiles
        run: python -m compileall -q hwprice tests
      - name: Catalog and data files are valid JSON
        run: |
          python - <<'PY'
          import glob, json
          for path in glob.glob("data/**/*.json", recursive=True):
              json.load(open(path, encoding="utf-8"))
              print("ok", path)
          PY
