name: refresh-prices

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the endpoints and the catalog
        run: python -m hwprice verify

      - name: Refresh the snapshot and the service list
        run: |
          python -m hwprice refresh | tee refresh.log
          python -m hwprice services

      - name: Open a pull request if something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No data changed."
            exit 0
          fi
          DAY="$(date -u +%Y-%m-%d)"
          BRANCH="data/refresh-${DAY}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data
          git commit -m "data: refresh price snapshot ${DAY}"
          git push origin "$BRANCH"
          {
            echo "Weekly refresh of the price snapshot."
            echo
            echo '```'
            cat refresh.log
            echo '```'
          } > body.md
          gh pr create --title "data: refresh price snapshot ${DAY}" --body-file body.md --base main --head "$BRANCH"
